[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/*"
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
authors = ["RustPdf Contributors"]
repository = "https://github.com/rustpdf/rustpdf"

[workspace.dependencies]
# Internal workspace crates
rustpdf-geom = { path = "crates/rustpdf-geom" }
rustpdf-filters = { path = "crates/rustpdf-filters" }
rustpdf-cos = { path = "crates/rustpdf-cos" }
rustpdf-model = { path = "crates/rustpdf-model" }
rustpdf-render = { path = "crates/rustpdf-render" }
rustpdf-organize = { path = "crates/rustpdf-organize" }
rustpdf-edit = { path = "crates/rustpdf-edit" }
rustpdf-annot = { path = "crates/rustpdf-annot" }
rustpdf-forms = { path = "crates/rustpdf-forms" }
rustpdf-fonts = { path = "crates/rustpdf-fonts" }
rustpdf-export = { path = "crates/rustpdf-export" }
rustpdf-engine = { path = "crates/rustpdf-engine" }
rustpdf-automation = { path = "crates/rustpdf-automation" }
rustpdf-ui = { path = "crates/rustpdf-ui" }

# External PDF dependencies
hayro = "0.8.0"
hayro-syntax = "0.8.0"
hayro-interpret = "0.8.0"
lopdf = "0.45.0"

# UI and Desktop
eframe = "0.36.2"
egui = "0.36.2"
rfd = "0.17.2"

# Utilities & System
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile = "3.17"
chrono = { version = "0.4", features = ["serde"] }
bytemuck = { version = "1.21", features = ["derive"] }
