name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (must match the workspace version)"
        required: true
        default: "v0.5.0"
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_name: rustpdf-windows-x86_64.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_name: rustpdf-linux-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_name: rustpdf-macos-aarch64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_name: rustpdf-macos-x86_64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev pkg-config

      - name: Verify release tag matches workspace version
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          raw_tag="${RELEASE_TAG_INPUT:-$GITHUB_REF_NAME}"
          tag="${raw_tag#v}"
          if [[ "$tag" != "$version" ]]; then
            echo "Release tag v$tag does not match Cargo workspace version $version" >&2
            exit 1
          fi

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force
          Copy-Item target/${{ matrix.target }}/release/rustpdf.exe staging/
          Copy-Item target/${{ matrix.target }}/release/rustpdf-cli.exe staging/
          Copy-Item scripts/RustPDF-Launcher.bat staging/
          Copy-Item README.md staging/
          Copy-Item LICENSE-MIT staging/
          Copy-Item LICENSE-APACHE staging/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.archive_name }} -Force

      - name: Package Unix Artifacts
        if: runner.os != 'Windows'
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/rustpdf staging/
          cp target/${{ matrix.target }}/release/rustpdf-cli staging/
          cp README.md staging/
          cp LICENSE-MIT staging/
          cp LICENSE-APACHE staging/
          tar -czvf ${{ matrix.archive_name }} -C staging .

      - name: Generate SHA-256 checksum
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          artifact = Path("${{ matrix.archive_name }}")
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest().upper()
          Path(f"{artifact.name}.sha256").write_text(
              f"{digest}  {artifact.name}\n", encoding="ascii"
          )

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256

  create-github-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
